apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkinsnativehelm
  namespace: argocd

spec:
  project: default

  sources:
       
    - repoURL: https://raw.githubusercontent.com/jenkinsci/kubernetes-operator/master/chart
      chart: jenkins-operator
      targetRevision: 0.9.0-beta2
      
    

   
    - repoURL: https://github.com/anandambitionv2/jenkinsnativeoverride.git
      targetRevision: main
      path: createmanifests
      directory:
        recurse: false

  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

   